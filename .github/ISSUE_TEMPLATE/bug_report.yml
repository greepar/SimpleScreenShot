name: Bug report
description: Report a reproducible problem in Simple ScreenShot
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed private information from screenshots and logs.
          required: true
  - type: input
    attributes:
      label: Simple ScreenShot version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    attributes:
      label: Ubuntu and GNOME Shell version
      placeholder: Ubuntu 24.04, GNOME Shell 46.0
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Session type
      options: [Wayland, X11]
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence that demonstrates the problem.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Relevant logs
      description: Paste only logs you have checked for private information.
      render: shell
