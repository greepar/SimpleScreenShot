name: Feature request
description: Suggest an improvement to the capture or editing workflow
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
      description: Describe the interaction and expected result.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
