name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GNOME test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gjs gnome-shell gir1.2-gtk-4.0 gir1.2-adw-1 \
            libgtk-4-dev libadwaita-1-dev xvfb zip
      - name: Run checks
        run: xvfb-run -a make check
